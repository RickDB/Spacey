services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: spacey
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spacey}
      POSTGRES_DB: spacey
    volumes:
      - postgres-data:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spacey"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPACEY_LISTEN: :8080
      SPACEY_DATABASE_URL: postgres://spacey:${POSTGRES_PASSWORD:-spacey}@db:5432/spacey?sslmode=disable
      SPACEY_SCAN_WORKERS: ${SPACEY_SCAN_WORKERS:-8}
      SPACEY_HOST_PREFIX: /
      SPACEY_CONTAINER_PREFIX: /host
      SPACEY_ZFS_DISCOVERY: auto
    ports:
      - "${SPACEY_PORT:-8080}:8080"
    volumes:
      # Read-only host view. Narrow this to selected mount roots in hardened deployments.
      - /:/host:ro,rslave
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  postgres-data:
